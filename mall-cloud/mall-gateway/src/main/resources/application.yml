# 网关配置：路由转发 + 服务发现
server:
  port: 8080

spring:
  application:
    name: mall-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}   # Nacos 注册中心
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}  # Sentinel 控制台（docker compose 内置）
        port: ${SENTINEL_PORT:8719}                      # 与控制台通信的本地端口
      eager: true                                        # 启动即连接控制台，便于观察
      # 规则配置中心化：网关流控（gw-flow）+ API 分组（gw-api-group）从 Nacos 拉取
      datasource:
        gw-flow:
          nacos:
            server-addr: ${NACOS_ADDR:localhost:8848}
            data-id: mall-gateway-flow-rules
            group-id: SENTINEL_GROUP
            rule-type: gw-flow
        gw-api-group:
          nacos:
            server-addr: ${NACOS_ADDR:localhost:8848}
            data-id: mall-gateway-api-group-rules
            group-id: SENTINEL_GROUP
            rule-type: gw-api-group
    gateway:
      # 路由规则：按服务名负载均衡转发（lb:// 前缀）
      routes:
        - id: user-route
          uri: lb://mall-user
          predicates:
            - Path=/user/**
        - id: product-route
          uri: lb://mall-product
          predicates:
            - Path=/product/**
        - id: order-route
          uri: lb://mall-order
          predicates:
            - Path=/order/**
      # 跨域：允许前端直连网关
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true

logging:
  level:
    com.mall.gateway: debug
