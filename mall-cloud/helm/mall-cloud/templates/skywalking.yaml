{{- if .Values.infra.skywalking.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-oap
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mall-cloud.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-oap
  ports:
    - name: grpc
      port: 11800
      targetPort: 11800
    - name: http
      port: 12800
      targetPort: 12800
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-oap
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mall-cloud.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-oap
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-oap
    spec:
      containers:
        - name: oap
          image: {{ .Values.infra.skywalking.image.oap }}
          ports:
            - containerPort: 11800
              name: grpc
            - containerPort: 12800
              name: http
          env:
            - name: SW_STORAGE
              value: h2
            - name: TZ
              value: Asia/Shanghai
          readinessProbe:
            tcpSocket:
              port: 11800
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ui
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mall-cloud.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-ui
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ui
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mall-cloud.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-ui
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-ui
    spec:
      containers:
        - name: ui
          image: {{ .Values.infra.skywalking.image.ui }}
          env:
            - name: SW_OAP_ADDRESS
              value: http://{{ .Release.Name }}-oap:12800
          ports:
            - containerPort: 8080
              name: http
{{- end }}
