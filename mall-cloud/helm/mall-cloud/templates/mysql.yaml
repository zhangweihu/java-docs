{{- if .Values.infra.mysql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-init-sql
  namespace: {{ .Values.global.namespace }}
data:
  01-mall_user.sql: |
{{ .Files.Get "files/mall_user.sql" | indent 4 }}
  02-mall_product.sql: |
{{ .Files.Get "files/mall_product.sql" | indent 4 }}
  03-mall_order.sql: |
{{ .Files.Get "files/mall_order.sql" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mysql
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mall-cloud.labels" . | nindent 4 }}
spec:
  clusterIP: None           # Headless：StatefulSet Pod DNS 直连
  selector:
    app: {{ .Release.Name }}-mysql
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
      name: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-mysql
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mall-cloud.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-mysql
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-mysql
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-mysql
    spec:
      containers:
        - name: mysql
          image: {{ .Values.infra.mysql.image }}
          args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: mysql-root-password
            - name: TZ
              value: Asia/Shanghai
          ports:
            - containerPort: 3306
              name: mysql
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: init-sql
          configMap:
            name: {{ .Release.Name }}-init-sql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.infra.mysql.storage }}
{{- end }}
