# Seata Server 文件模式配置（演示最小化；生产建议 store.mode=db 配合数据库）
store {
  mode = "file"
  file {
    dir = "sessionStore"
    maxBranchSessionSize = 16384
    maxGlobalSessionSize = 512
  }
}

# 事务分组映射：tx-service-group -> 集群名（客户端侧 tx-service-group 需与此对应）
service {
  vgroupMapping {
    mall_tx_group = "default"
  }
}
