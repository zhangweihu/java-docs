# Seata Server 注册中心配置：注册到 Nacos（应用侧需配置相同的 tx-service-group 映射）
registry {
  type = "nacos"
  nacos {
    application = "seata-server"
    serverAddr = "localhost:8848"
    namespace = ""
    group = "SEATA_GROUP"
    username = "nacos"
    password = "nacos"
  }
}

config {
  type = "file"
  file {
    name = "file.conf"
  }
}
