# =============================================================
# mall-cloud 基础设施编排：MySQL(3 库) + Redis + Nacos + Seata
# 使用：cd docker && docker compose up -d
# 应用服务（mall-user/mall-product/mall-order）在 IDE 或单独容器中启动，
# 通过 NACOS_ADDR 环境变量指向本编排暴露的 Nacos。
# =============================================================
version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mall-cloud-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mall-cloud-mysql-data:/var/lib/mysql
      # 首次启动自动建三个业务库 + undo_log 表
      - ../sql/mall_user.sql:/docker-entrypoint-initdb.d/01-mall_user.sql:ro
      - ../sql/mall_product.sql:/docker-entrypoint-initdb.d/02-mall_product.sql:ro
      - ../sql/mall_order.sql:/docker-entrypoint-initdb.d/03-mall_order.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mall-cloud-redis
    ports:
      - "6379:6379"

  # Nacos：standalone 单机模式（内置 derby 存储）
  # Sentinel 流控规则发布：启动后执行 nacos-config/init-sentinel-rules.(sh|ps1) 一次性导入即可
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: mall-cloud-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"   # 控制台 http://localhost:8848/nacos（nacos/nacos）
      - "9848:9848"   # gRPC 端口（客户端必须能访问）
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Sentinel 控制台：查看实时流量/规则，动态调整限流（默认账号 sentinel/sentinel）
  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: mall-cloud-sentinel
    ports:
      - "8858:8858"

  # Seata Server：注册到 Nacos，配置用 file 模式（挂载 registry.conf 简化演示）
  seata-server:
    image: seataio/seata-server:1.8.0
    container_name: mall-cloud-seata
    environment:
      SEATA_IP: 127.0.0.1
      TZ: Asia/Shanghai
    ports:
      - "8091:8091"
    volumes:
      - ./seata/registry.conf:/seata-server/resources/registry.conf:ro
      - ./seata/file.conf:/seata-server/resources/file.conf:ro
    depends_on:
      nacos:
        condition: service_healthy

volumes:
  mall-cloud-mysql-data:
