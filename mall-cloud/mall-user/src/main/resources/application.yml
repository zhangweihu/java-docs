# 用户服务配置
server:
  port: 8081

spring:
  application:
    name: mall-user
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/mall_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
    # 从 Nacos 配置中心拉取动态配置（optional: 允许配置中心暂时不可用）
    config:
      import: optional:nacos:mall-user.yaml

# JWT 与网关保持一致（生产由环境变量注入同一密钥）
mall:
  jwt:
    secret: ${JWT_SECRET:mall-cloud-jwt-secret-key-please-change-in-prod-0123456789}
    expire-hours: ${JWT_EXPIRE_HOURS:24}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
