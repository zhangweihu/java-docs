# Seata Server 1.8：file 模式 + Nacos 注册（与应用侧 registry.conf 对应）
# 配置内容与 docker/seata/ 下保持一致，仅把 serverAddr 改为集群内地址
apiVersion: v1
kind: ConfigMap
metadata:
  name: seata-config
  namespace: mall-cloud
data:
  registry.conf: |
    registry {
      type = "nacos"
      nacos {
        application = "seata-server"
        serverAddr = "mall-nacos:8848"
        namespace = ""
        group = "SEATA_GROUP"
        username = "nacos"
        password = "nacos"
      }
    }
    config {
      type = "file"
      file {
        name = "file.conf"
      }
    }
  file.conf: |
    store {
      mode = "file"
      file {
        dir = "sessionStore"
      }
    }
    service {
      vgroupMapping {
        mall_tx_group = "default"
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: mall-seata
  namespace: mall-cloud
spec:
  selector:
    app: mall-seata
  ports:
    - port: 8091
      targetPort: 8091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-seata
  namespace: mall-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mall-seata
  template:
    metadata:
      labels:
        app: mall-seata
    spec:
      containers:
        - name: seata
          image: seataio/seata-server:1.8.0
          env:
            - name: SEATA_PORT
              value: "8091"
            - name: STORE_MODE
              value: file
            - name: SERVER_NODE
              value: "1"
          ports:
            - containerPort: 8091
          volumeMounts:
            - name: conf
              mountPath: /seata-server/resources
      volumes:
        - name: conf
          configMap:
            name: seata-config
