# Sentinel 控制台：查看/调整限流规则（默认账号 sentinel/sentinel）
# 各服务通过配置中的 SENTINEL_DASHBOARD=mall-sentinel:8858 上报
apiVersion: v1
kind: Service
metadata:
  name: mall-sentinel
  namespace: mall-cloud
spec:
  selector:
    app: mall-sentinel
  ports:
    - port: 8858
      targetPort: 8858
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-sentinel
  namespace: mall-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mall-sentinel
  template:
    metadata:
      labels:
        app: mall-sentinel
    spec:
      containers:
        - name: sentinel
          image: bladex/sentinel-dashboard:1.8.6
          ports:
            - containerPort: 8858
