# 网关：唯一对外入口（鉴权 + 路由 + 限流）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-gateway
  namespace: mall-cloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mall-gateway
  template:
    metadata:
      labels:
        app: mall-gateway
    spec:
      containers:
        - name: gateway
          image: mall-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: mall-cloud-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mall-cloud-secret
                  key: nacos-auth-password
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: mall-gateway-svc
  namespace: mall-cloud
spec:
  selector:
    app: mall-gateway
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
