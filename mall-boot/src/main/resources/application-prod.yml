# 生产环境配置：敏感项全部通过环境变量注入，禁止硬编码
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s

mall:
  jwt:
    secret: ${JWT_SECRET}        # 必须通过环境变量提供，>=32 字节
    expire-hours: ${JWT_EXPIRE_HOURS:24}

logging:
  level:
    com.mall: info
  file:
    name: logs/mall-boot.log      # 落盘日志，配合 logrotate 轮转

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl  # 生产不打印 SQL
