# 应用环境变量（envFrom 整体注入 Deployment，Spring 宽松绑定自动映射到配置项）
# 敏感值（数据库密码）放 secret.yaml，不放在这里
apiVersion: v1
kind: ConfigMap
metadata:
  name: mall-boot-config
  namespace: mall-boot
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mall-mysql:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false"
  SPRING_DATASOURCE_USERNAME: "root"
  SPRING_DATA_REDIS_HOST: "mall-redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: ""
  TZ: "Asia/Shanghai"
